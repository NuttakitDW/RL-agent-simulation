<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roostoo Labs — Strategy Lab</title>
<link rel="icon" type="image/png" href="brand/roostoo-icon.png">
<link rel="apple-touch-icon" href="brand/roostoo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Roostoo dark scaffold ── */
    --bg: #0C1117;          /* darkColor — dark mode scaffold */
    --bg2: #080C11;
    --panel: #141B23;       /* card surface (lifted from #0C1117) */
    --panel2: #1B232D;      /* nested control */
    --panel3: #28323E;      /* tracks / inert fills */
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #FFFFFF;
    --muted: #BDBDBD;       /* grey[400] */
    --dim: #6E7A8A;
    /* ── brand ── */
    --accent: #FEDB29;      /* brand yellow */
    --accent-warm: #FFBF12; /* gradient stop */
    --green: #00FF87;       /* dark-mode gain */
    --red: #EF5144;
    --orange: #FF873C;      /* action / links / selected / chart line */
    /* ── type ── */
    --display: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
    /* ── radii ── */
    --r-sm: 6px;            /* inputs */
    --r-md: 8px;            /* cards / dialogs */
    --r-pill: 24px;         /* buttons / chips */
    /* ── elevation ── */
    --elev-card: 0 0.4px 1px rgba(0,0,0,0.35);
    --elev-sheet: 0 24px 60px rgba(0,0,0,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #app { height: 100vh; display: flex; flex-direction: column; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* ── brand bar (app bar, elevation 1) ── */
  .bar { display: flex; align-items: center; gap: 11px; padding: 11px 22px; border-bottom: 1px solid var(--border); background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,0.35); flex-shrink: 0; }
  .bar img.icon { width: 30px; height: 30px; object-fit: contain; border-radius: 8px; background: #1A1A1A; padding: 2px; }
  .bar .logo { font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--text); white-space: nowrap; letter-spacing: -0.01em; }
  .bar .tag { color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  .bar .dot { color: var(--orange); font-size: 6px; margin: 0 7px; vertical-align: middle; }
  .nameWrap { display: flex; align-items: center; gap: 9px; margin-left: 20px; flex: 1; min-width: 0; }
  .nameWrap .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; white-space: nowrap; }
  .nameInput { background: rgba(255,255,255,0.06); border: 1px solid transparent; border-radius: 6px; color: var(--text); font-family: var(--display); font-weight: 700; font-size: 15px; padding: 6px 11px; outline: none; min-width: 0; width: 240px; transition: border-color 0.15s; }
  .nameInput:hover { border-color: var(--border2); }
  .nameInput:focus { border-color: var(--accent); }
  .finalizeBtn { background: var(--accent); color: #0C1117; border: none; padding: 11px 24px; border-radius: 24px; font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: 0.073em; text-transform: uppercase; cursor: pointer; transition: filter 0.16s, transform 0.16s; white-space: nowrap; }
  .finalizeBtn:hover { filter: brightness(1.05); }
  .finalizeBtn:active { transform: scale(0.98); }
  .finalizeBtn:disabled { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.4); cursor: not-allowed; }
  .barHint { font-size: 12px; color: var(--dim); font-family: var(--mono); white-space: nowrap; }

  /* ── copilot chat dock ── */
  .chatDock { margin: 13px 18px 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--elev-card); }
  .chatTop { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; user-select: none; }
  .aiSpark { color: var(--accent); font-size: 14px; line-height: 1; }
  .aiTitle { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0; white-space: nowrap; }
  .aiSub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatClps { margin-left: auto; background: none; border: none; color: var(--orange); cursor: pointer; font-size: 12px; font-weight: 600; font-family: var(--display); padding: 2px 6px; white-space: nowrap; }
  .chatClps:hover { filter: brightness(1.15); }
  .chatBody { display: flex; flex-direction: column; min-height: 0; }
  .chatDock.closed .chatBody { display: none; }
  .chatScroll { height: 122px; overflow-y: auto; padding: 2px 16px 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #2a323d transparent; }
  .cm { max-width: 66%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.55; }
  .cm.bot { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .cm.user { align-self: flex-end; background: rgba(254,219,41,0.12); border: 1px solid rgba(254,219,41,0.34); border-bottom-right-radius: 4px; }
  .cm.typing { color: var(--dim); font-family: var(--mono); letter-spacing: 2px; }
  .cm .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
  .chipQ { background: transparent; border: 1px solid var(--border2); color: var(--muted); border-radius: 24px; padding: 5px 12px; font-size: 11px; cursor: pointer; font-family: var(--body); font-weight: 500; transition: all 0.13s; }
  .chipQ:hover { border-color: var(--orange); color: var(--orange); }
  .chatApply { display: inline-flex; margin-top: 9px; background: rgba(0,255,135,0.08); border: 1px dashed rgba(0,255,135,0.45); color: var(--green); border-radius: 24px; padding: 5px 13px; font-size: 11px; font-weight: 600; font-family: var(--body); cursor: pointer; }
  .chatApply:hover { background: rgba(0,255,135,0.16); }
  .chatInRow { display: flex; gap: 9px; padding: 11px 14px 13px; border-top: 1px solid var(--border); }
  .chatInRow input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 9px 13px; font-size: 13px; outline: none; font-family: var(--body); }
  .chatInRow input::placeholder { color: var(--dim); }
  .chatInRow input:focus { border-color: var(--accent); }
  .chatSend { background: var(--accent); color: #0C1117; border: none; border-radius: 24px; padding: 0 20px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.073em; }
  .chatSend:hover { filter: brightness(1.05); }

  /* ── "?" info tooltips (filled-dot style like exchange info icons) ── */
  .qTip { display: inline-flex; width: 14px; height: 14px; border-radius: 50%; background: var(--panel3); color: var(--muted); font-size: 9px; align-items: center; justify-content: center; cursor: help; margin-left: 5px; font-family: var(--body); font-weight: 700; vertical-align: middle; flex-shrink: 0; }
  .qTip:hover { background: var(--orange); color: #0C1117; }
  #tipPop { position: fixed; z-index: 80; max-width: 276px; background: #1B232D; border: 1px solid var(--border2); border-radius: 8px; padding: 12px 14px; font-size: 12px; line-height: 1.65; color: var(--muted); box-shadow: var(--elev-sheet); display: none; pointer-events: none; }
  #tipPop b { color: var(--accent); font-weight: 700; }

  /* ── workbench grid ── */
  .bench { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0,1fr) 274px; gap: 14px; padding: 14px 18px 16px; }
  @media (max-width: 1100px) { .bench { grid-template-columns: 264px minmax(0,1fr); } .railR { display: none; } }
  .rail { overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .rail::-webkit-scrollbar { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; box-shadow: var(--elev-card); }
  .panel h4 { margin: 0 0 12px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

  /* roster */
  .roster { display: flex; flex-direction: column; gap: 5px; }
  .rItem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; background: transparent; width: 100%; font-family: inherit; color: var(--text); text-align: left; transition: all 0.13s; position: relative; }
  .rItem:hover { background: rgba(255,255,255,0.04); }
  .rItem.on { background: rgba(254,219,41,0.07); border-color: rgba(254,219,41,0.45); }
  .rItem img { width: 28px; height: 28px; border-radius: 50%; background: #1B232D; }
  .rItem .rs { flex: 1; min-width: 0; }
  .rItem .sym { font-size: 14px; font-weight: 700; }
  .rItem .meta { font-size: 11px; color: var(--dim); }
  .rItem .meta.pos { color: var(--green); }
  .rItem .meta.neg { color: var(--red); }
  .rItem .stDot { width: 8px; height: 8px; border-radius: 50%; background: #333d49; flex-shrink: 0; }
  .rItem .stDot.tested { background: var(--green); box-shadow: 0 0 6px rgba(0,255,135,0.6); }
  .rItem .stDot.stale { background: var(--orange); }
  .rItem .stDot.live { background: var(--accent); animation: blink 0.9s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .rItem .rr { background: none; border: none; color: var(--dim); font-size: 14px; cursor: pointer; padding: 2px 3px; visibility: hidden; line-height: 1; }
  .rItem:hover .rr { visibility: visible; }
  .rItem .rr.need { visibility: visible; color: var(--orange); }
  .rItem .rr:hover { color: var(--accent); }
  .rItem .rm { background: none; border: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 2px 4px; visibility: hidden; }
  .rItem:hover .rm { visibility: visible; }
  .rItem .rm:hover { color: var(--red); }
  .addBtn { margin-top: 8px; width: 100%; padding: 9px; background: transparent; border: 1px dashed var(--border2); border-radius: 24px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.13s; }
  .addBtn:hover { border-color: var(--orange); color: var(--orange); }
  .addGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 9px; }
  .addCell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-family: var(--body); font-size: 10px; font-weight: 700; color: var(--muted); transition: all 0.13s; }
  .addCell:hover { border-color: var(--accent); color: var(--text); }
  .addCell img { width: 22px; height: 22px; border-radius: 50%; }

  /* config */
  .cfgUni { font-size: 12px; color: var(--dim); line-height: 1.55; margin: -4px 0 12px; }
  .cfgUni b { color: var(--accent); font-weight: 700; }
  .cfgLbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin: 14px 0 7px; display: flex; align-items: center; }
  .cfgLbl:first-of-type { margin-top: 0; }
  .radioRow { display: flex; gap: 6px; }
  .radio { flex: 1; text-align: center; padding: 8px 4px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--body); color: var(--muted); transition: all 0.13s; }
  .radio:hover { border-color: var(--border2); }
  .radio.on { background: var(--accent); border-color: var(--accent); color: #0C1117; font-weight: 700; }
  .ftGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .ft { display: flex; align-items: center; gap: 7px; padding: 6px 9px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; font-weight: 500; cursor: pointer; user-select: none; font-family: var(--body); color: var(--muted); transition: all 0.13s; }
  .ft:hover { border-color: var(--border2); }
  .ft.on { border-color: rgba(254,219,41,0.5); background: rgba(254,219,41,0.07); color: var(--text); }
  .ft.off { opacity: 0.4; }
  .ft i { width: 7px; height: 7px; border-radius: 2px; background: #333d49; flex-shrink: 0; }
  .ft.on i { background: var(--accent); }

  /* ── center stage ── */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 12px; }
  .streamLine { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 8px 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; white-space: nowrap; overflow: hidden; min-height: 38px; box-shadow: var(--elev-card); }
  .streamLine .sDot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 1.1s infinite; flex-shrink: 0; }
  .streamLine .csv { color: var(--orange); overflow: hidden; text-overflow: ellipsis; }
  .streamLine .csv.stale { color: var(--orange); }
  .streamLine .kb { margin-left: auto; color: var(--dim); }
  .streamBarMini { width: 92px; height: 5px; background: var(--panel3); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .streamBarMini i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width 0.12s; }
  .runNow { background: var(--accent); color: #0C1117; border: none; border-radius: 24px; padding: 6px 15px; font-size: 11px; font-weight: 700; letter-spacing: 0.073em; text-transform: uppercase; cursor: pointer; font-family: var(--display); flex-shrink: 0; }
  .runNow:hover { filter: brightness(1.05); }

  .stagePanel { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--elev-card); }
  .headStats { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
  .hs { display: flex; flex-direction: column; gap: 2px; }
  .hs .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); font-weight: 600; white-space: nowrap; }
  .hs .v { font-family: var(--display); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; font-size: 21px; font-weight: 700; white-space: nowrap; letter-spacing: -0.01em; }
  .hs .v.pos { color: var(--green); } .hs .v.neg { color: var(--red); } .hs .v.gold { color: var(--accent); }
  .spdWrap { margin-left: auto; display: flex; gap: 5px; }
  .spd { padding: 6px 11px; background: var(--panel2); border: 1px solid var(--border); border-radius: 24px; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; font-family: var(--display); letter-spacing: 0.04em; }
  .spd.on { background: var(--accent); color: #0C1117; border-color: var(--accent); }
  .spd:hover:not(.on) { border-color: var(--orange); color: var(--orange); }
  canvas#cvPrice { width: 100%; flex: 1; min-height: 0; display: block; }
  .lowRow { display: grid; grid-template-columns: minmax(0,1fr) 200px; gap: 16px; flex-shrink: 0; }
  canvas#cvReward { width: 100%; height: 104px; display: block; }
  .miniLbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); font-weight: 600; margin-bottom: 5px; white-space: nowrap; }
  .probRow { display: grid; grid-template-columns: 32px 1fr 38px; gap: 7px; align-items: center; margin-bottom: 6px; }
  .probRow .n { font-size: 10px; font-weight: 700; font-family: var(--display); letter-spacing: 0.04em; }
  .probRow .n.sell { color: var(--red); } .probRow .n.hold { color: var(--muted); } .probRow .n.buy { color: var(--green); }
  .probTrack { background: var(--panel3); height: 11px; border-radius: 3px; overflow: hidden; position: relative; }
  .probFill { position: absolute; inset: 0 auto 0 0; transition: width 0.14s; border-radius: 3px; }
  .probFill.sell { background: var(--red); } .probFill.hold { background: #5a6675; } .probFill.buy { background: var(--green); }
  .probRow .p { font-family: var(--mono); font-size: 10px; font-weight: 600; text-align: right; color: var(--muted); }
  canvas#cvEquity { width: 100%; height: 46px; display: block; }

  /* ── right rail: PPO loop + verdict ── */
  .loopGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; position: relative; }
  .loopBox { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 11px; transition: all 0.22s; min-height: 66px; }
  .loopBox.active { border-color: var(--accent); background: rgba(254,219,41,0.07); box-shadow: 0 0 12px rgba(254,219,41,0.16); }
  .loopBox .ln { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); color: #0C1117; font-size: 9px; font-weight: 700; font-family: var(--mono); margin-right: 6px; }
  .loopBox .lt { font-size: 11px; font-weight: 700; font-family: var(--display); letter-spacing: 0.04em; }
  .loopBox .lv { margin-top: 6px; font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.55; }
  .loopBox .lv b { color: var(--text); font-weight: 600; }
  .loopBox .lv b.pos { color: var(--green); } .loopBox .lv b.neg { color: var(--red); }
  .loopCenter { text-align: center; margin: 2px 0 9px; }
  .loopCenter .ep { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
  .loopCenter .sub { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-top: 4px; }
  .loopCycleLbl { text-align: center; font-size: 10px; color: var(--dim); font-family: var(--mono); margin-top: 8px; letter-spacing: 0.02em; }
  .loopCycleLbl b { color: var(--accent); }

  /* verdict card */
  .vCard { border: 1px solid rgba(0,255,135,0.4); background: rgba(0,255,135,0.05); border-radius: 8px; padding: 14px; display: none; }
  .vCard.bad { border-color: rgba(239,81,68,0.4); background: rgba(239,81,68,0.05); }
  .vCard.show { display: block; animation: vbIn 0.35s cubic-bezier(0.33,1,0.68,1); }
  @keyframes vbIn { from { transform: translateY(8px); } }
  .vGradeRow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .vGrade { width: 32px; height: 32px; border-radius: 8px; background: var(--green); color: #05281a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; font-family: var(--display); flex-shrink: 0; }
  .vCard.bad .vGrade { background: var(--red); color: #2b0606; }
  .vTitle { font-size: 13px; font-weight: 700; font-family: var(--display); line-height: 1.3; }
  .vTitle .vsym { display: block; font-size: 11px; color: var(--dim); font-family: var(--mono); font-weight: 400; margin-top: 2px; }
  .vStale { margin: 0 0 10px; font-size: 11px; color: var(--orange); line-height: 1.5; }
  .vRow { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); white-space: nowrap; }
  .vRow:last-of-type { border-bottom: none; }
  .vRow b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .vRerun { margin-top: 11px; width: 100%; padding: 8px; background: transparent; border: 1px solid var(--border2); border-radius: 24px; color: var(--muted); font-size: 11px; font-weight: 600; font-family: var(--display); cursor: pointer; letter-spacing: 0.02em; transition: all 0.13s; }
  .vRerun:hover { border-color: var(--orange); color: var(--orange); }

  /* ── overlays ── */
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,0.74); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 40; padding: 20px; }
  .ovl.show { display: flex; }
  .sheet { width: 560px; max-width: 94vw; max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border2); border-radius: 8px; padding: 28px 30px; scrollbar-width: none; box-shadow: var(--elev-sheet); }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet h3 { margin: 0 0 5px; font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .sheet .sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; line-height: 1.5; }
  .sheet .sub b { color: var(--text); font-weight: 700; }
  .rkRow { margin-bottom: 17px; }
  .rkHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .rkHead .t { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .rkHead .v { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; color: var(--accent); }
  .rkHead .v.off { color: var(--dim); }
  .rkCtl { display: flex; align-items: center; gap: 12px; }
  .rkCtl input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; background: var(--panel3); border-radius: 3px; outline: none; cursor: pointer; }
